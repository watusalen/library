# Application
spring.application.name=library-api
server.port=8080

# Datasource (PostgreSQL - docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=library_user
spring.datasource.password=library_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update: cria/ajusta tabelas automaticamente em dev.
# Trocar para "validate" quando adicionarmos Flyway/Liquibase no futuro.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (RNF04, RNF07)
jwt.secret=change-this-secret-in-a-real-environment-please
jwt.expiration-seconds=3600